---
# StorageClass GP3 optimisé pour les performances
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  labels:
    project: bfs-gp12
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  iops: "3000"
  throughput: "125"
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true

---
# StorageClass GP3 haute performance
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-high-perf
  labels:
    project: bfs-gp12
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  iops: "10000"
  throughput: "500"
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true

---
# PriorityClass pour les pods critiques
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
  labels:
    project: bfs-gp12
value: 1000
globalDefault: false
description: "High priority for critical Online Boutique services"

---
# PriorityClass pour les pods normaux
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: medium-priority
  labels:
    project: bfs-gp12
value: 500
globalDefault: false
description: "Medium priority for normal Online Boutique services"

---
# PriorityClass pour les pods non-critiques
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: low-priority
  labels:
    project: bfs-gp12
value: 100
globalDefault: false
description: "Low priority for non-critical services"

---
# ResourceQuota pour le namespace online-boutique
apiVersion: v1
kind: ResourceQuota
metadata:
  name: online-boutique-quota
  namespace: online-boutique
  labels:
    project: bfs-gp12
spec:
  hard:
    requests.cpu: "50"
    requests.memory: "100Gi"
    limits.cpu: "100"
    limits.memory: "200Gi"
    persistentvolumeclaims: "10"
    services.loadbalancers: "3"

---
# LimitRange pour éviter les pods trop gourmands
apiVersion: v1
kind: LimitRange
metadata:
  name: online-boutique-limits
  namespace: online-boutique
  labels:
    project: bfs-gp12
spec:
  limits:
  - max:
      cpu: "2"
      memory: "4Gi"
    min:
      cpu: "10m"
      memory: "10Mi"
    default:
      cpu: "200m"
      memory: "256Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
  - max:
      cpu: "4"
      memory: "8Gi"
    min:
      cpu: "10m"
      memory: "10Mi"
    type: Pod

